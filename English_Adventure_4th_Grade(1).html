<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English Adventure – 4th Grade</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#dff6ff,#fff3d6);color:#24324a}
.app{max-width:1000px;margin:auto;padding:24px}.card{background:white;border-radius:24px;padding:28px;box-shadow:0 10px 30px #0001;margin-bottom:20px}
h1{font-size:38px;margin:5px 0}.subtitle{color:#667085}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
button{border:0;border-radius:16px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#eef2ff;color:#24324a}
button:hover{transform:translateY(-2px)}.unit{min-height:100px;text-align:left}.unit span{font-size:28px;display:block}
.hidden{display:none}.question{font-size:30px;font-weight:800;margin:25px 0}.pill{display:inline-block;padding:8px 12px;border-radius:20px;background:#fff0c2;margin:4px}.score{font-size:22px;font-weight:800}.levels{display:flex;gap:10px;flex-wrap:wrap}.level{flex:1;min-width:130px}.easy{background:#e8f7e8}.challenge{background:#fff4d6}.super{background:#ffe5e5}.feedback{font-size:20px;font-weight:700;min-height:30px;margin:18px 0}
.small{font-size:14px;color:#667085}.back{background:#f2f4f7}.next{background:#dff3ff}.reset{background:#eee}
</style>
</head>
<body>
<div class="app">
<div class="card">
<h1>🎮 English Adventure</h1>
<div class="subtitle">4th Grade Speaking Game • Choose a unit and speak!</div>
<div class="score">⭐ Score: <span id="score">0</span></div>
</div>

<div id="home" class="card">
<h2>Choose your adventure!</h2>
<div class="units" id="units"></div>
</div>

<div id="game" class="card hidden">
<button class="back" onclick="goHome()">← Units</button>
<div id="unitTitle"></div>
<div id="level"></div>
<div class="question" id="question"></div>
<div class="small">🎤 Say your answer aloud. Then choose your level.</div>
<div class="levels">
<button class="level easy" onclick="answer(1)">🟢 Easy<br>+1 point</button>
<button class="level challenge" onclick="answer(2)">🟡 Challenge<br>+2 points</button>
<button class="level super" onclick="answer(3)">🔴 Super Challenge<br>+3 points</button>
</div>
<div class="feedback" id="feedback"></div>
<button class="next" onclick="nextQuestion()">Next Challenge →</button>
</div>

<div id="finish" class="card hidden">
<h2>🏆 Adventure Complete!</h2>
<p id="finalText"></p>
<button onclick="goHome()">Play Another Unit</button>
<button class="reset" onclick="resetScore()">Reset Score</button>
</div>
</div>

<script>
const data=[
["🏫","Unit 1 – Classroom Rules",[
"Say 3 classroom rules.","What do you say when you want to open the window?","Tell me 3 things you have in your school bag.","Give your teacher one polite classroom instruction.","What do you do when the teacher says: 'Listen!'?"]],
["🌍","Unit 2 – Nationality",[
"Where are you from?","What nationality are you?","Name 3 countries.","What language do people speak in Türkiye?","Ask your friend where they are from."]],
["🦸","Unit 3 – Cartoon Characters",[
"Name your favourite cartoon character.","Can your favourite character fly?","Describe a cartoon character.","What can a superhero do?","Ask a friend: 'Can you...?'."]],
["⚽","Unit 4 – Free Time",[
"What do you do in your free time?","Tell me 3 hobbies.","Do you like playing games? Why?","What does your best friend do after school?","Ask your friend about their favourite hobby."]],
["⏰","Unit 5 – My Day",[
"What time do you get up?","Tell me 3 things you do in the morning.","What time do you go to school?","What do you do after school?","Describe your day in 4 sentences."]],
["🔬","Unit 6 – Fun with Science",[
"Count from 1 to 20.","Name 5 things you can see in a science classroom.","What colour is the sky?","How many legs does a spider have?","Make a simple question about numbers and answer it."]],
["👩‍⚕️","Unit 7 – Jobs",[
"What is your dream job?","What does a doctor do?","Name 5 jobs.","What does a teacher do?","Choose a job and describe what this person does."]],
["👕","Unit 8 – My Clothes",[
"What are you wearing today?","Name 5 clothes.","What colour is your T-shirt?","Describe your friend's clothes.","Imagine it is winter. What are you wearing?"]],
["👧","Unit 9 – My Friends",[
"Describe your best friend.","What does your friend look like?","Say 3 personality adjectives.","What has your friend got?","Introduce your friend in 4 sentences."]],
["🍕","Unit 10 – Food and Drinks",[
"What's your favourite food?","Do you like pizza? Why?","Name 5 fruits.","What do you usually drink?","Imagine you are in a café. Order a food and a drink."]]
];
let current=0,q=0,score=0,answered=false;
const units=document.getElementById("units");
data.forEach((u,i)=>{let b=document.createElement("button");b.className="unit";b.innerHTML=`<span>${u[0]}</span><b>${u[1]}</b><br><small>5 speaking challenges</small>`;b.onclick=()=>start(i);units.appendChild(b)});
function start(i){current=i;q=0;answered=false;home.classList.add("hidden");finish.classList.add("hidden");game.classList.remove("hidden");render()}
function render(){unitTitle.innerHTML=`<h2>${data[current][0]} ${data[current][1]}</h2>`;level.innerHTML=`<span class="pill">Challenge ${q+1} / 5</span>`;question.textContent=data[current][2][q];feedback.textContent="";answered=false}
function answer(points){if(answered)return;answered=true;score+=points;document.getElementById("score").textContent=score;feedback.textContent=points===3?"🔥 Super! Great speaking!":points===2?"🌟 Great job!":"👏 Good job! Keep speaking!"}
function nextQuestion(){if(!answered){feedback.textContent="🎤 Speak first, then choose a level!";return} if(q<4){q++;render()}else{game.classList.add("hidden");finish.classList.remove("hidden");finalText.innerHTML=`You finished <b>${data[current][1]}</b>!<br><br>Your total score is <b>⭐ ${score}</b>. Keep practicing English!`}}
function goHome(){game.classList.add("hidden");finish.classList.add("hidden");home.classList.remove("hidden")}
function resetScore(){score=0;document.getElementById("score").textContent=0;goHome()}
</script>
</body>
</html>
